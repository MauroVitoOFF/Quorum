modLoader = "javafml"
loaderVersion = "[4,)"
license = "Apache-2.0"

[[mods]]
modId = "qrm_clock"
version = "${qrm_version}"
displayName = "QRM Clock"
description = '''Modulo del tempo di QRM: giorno di gioco più lungo, data e stagioni che seguono il calendario reale.'''

[[dependencies.qrm_clock]]
modId = "qrm"
type = "required"
versionRange = "[${qrm_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.qrm_clock]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"
