name: website
on:
  push:
    branches: [main]
    # qrm-*/src/main: la build confronta le tabelle di riferimento della wiki con il codice del mod
    paths: ['website/**', 'gradle.properties', 'qrm-*/src/main/**', 'docs/samples/**', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'gradle.properties', 'qrm-*/src/main/**', 'docs/samples/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  # Pubblica su GitHub Pages solo da main. Richiede Settings → Pages → Source: GitHub Actions
  # e una repository pubblica (o un piano che consenta Pages su repository private).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
