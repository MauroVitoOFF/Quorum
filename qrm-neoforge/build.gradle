plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

base { archivesName = 'qrm' }

neoForge {
    version = project.neo_version

    runs {
        server {
            server()
            gameDirectory = project.file('run')
            programArguments.add('--nogui')
        }
    }

    mods {
        qrm {
            sourceSet sourceSets.main
            // qrm-client-api usa classi Minecraft: in sviluppo e nei test deve stare nello stesso livello di classi del mod
            // (altrimenti il class loader dell'applicazione non vede le classi Minecraft trasformate: LinkageError).
            sourceSet project(':qrm-client-api').sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.qrm
    }
}

dependencies {
    implementation project(':qrm-api')
    implementation project(':qrm-core')
    implementation project(':qrm-client-api')
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'

    jarJar(project(':qrm-api'))
    jarJar(project(':qrm-core'))
    jarJar('org.xerial:sqlite-jdbc') { version { strictly '[3.46,4)'; prefer '3.46.1.3' } }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// qrm-client-api usa classi Minecraft: nel jar di QRM come classi normali del mod (livello del gioco), NON come jar-in-jar,
// perche' le librerie annidate stanno in un livello che non vede le classi Minecraft trasformate (VerifyError/LinkageError).
// I moduli esterni la usano solo in compilazione (compileOnly project/artefatto qrm-client-api).
tasks.named('jar') {
    from project(':qrm-client-api').sourceSets.main.output
}

tasks.withType(ProcessResources).configureEach {
    var props = [minecraft_version: project.minecraft_version, neo_version: project.neo_version, qrm_version: project.qrm_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
